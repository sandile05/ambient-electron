<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="Ambient Electron Pty Ltd logo">
  <title>Ambient Electron Pty Ltd</title>
  <desc>Tilted ellipse orbital ring with cyan source dot — horizontal logo mark</desc>

  <!-- glow halo behind dot -->
  <circle cx="88" cy="80" r="36" fill="rgba(0,207,255,0.06)"/>
  <circle cx="88" cy="80" r="22" fill="rgba(0,207,255,0.10)"/>

  <!-- tilted orbital ellipse -->
  <ellipse cx="88" cy="80" rx="60" ry="21"
    fill="none" stroke="#00cfff" stroke-width="2.2"
    transform="rotate(-35 88 80)"/>

  <!-- source dot -->
  <circle cx="88" cy="80" r="13" fill="#00cfff"/>

  <!-- electron dot -->
  <circle cx="53" cy="42" r="5.5" fill="#00cfff" opacity="0.75"/>

  <!-- wordmark -->
  <text x="174" y="58"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="500" font-size="34"
    fill="#e8f2ff" letter-spacing="-0.01em">Ambient</text>
  <text x="174" y="98"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="500" font-size="34"
    fill="#e8f2ff" letter-spacing="-0.01em">Electron</text>
  <text x="176" y="120"
    font-family="'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="400" font-size="11"
    fill="#00cfff" letter-spacing="0.24em">PTY LTD</text>
</svg>
